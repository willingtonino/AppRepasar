el almacenamiento de la base de datos subyacente","Capacidades de machine learning integradas para el análisis de datos","Rendimiento mejorado de las aplicaciones mediante el almacenamiento de caché en memoria"],"correcta":"D","explicacion":"La función principal de ElastiCache es proporcionar almacenamiento de caché en memoria que permita a las aplicaciones recuperar datos de almacenes de memoria rápidos en lugar de bases de datos basadas en disco, más lentas. Esto reduce significativamente la latencia y mejora el rendimiento general de las aplicaciones."},{"pregunta":"Qué enunciado describe las responsabilidades de los clientes que utilizan los servicios de bases de datos de AWS completamente administrados?","opciones":["Los clientes son responsables de supervisar y generar métricas para sus datos.","Los clientes son responsables de implementar y administrar las soluciones antivirus en los sistemas operativos de los servicios de bases de datos completamente administrados.","Los clientes son responsables del aprovisionamiento, el escalado, la aplicación de parches y las copias de seguridad.","Los clientes son responsables de diseñar las estructuras de datos y administrar los controles de acceso."],"correcta":"D","explicacion":"Los servicios de bases de datos de AWS completamente administrados solo requieren que los clientes se hagan cargo del diseño de las estructuras de datos y la administración de los controles de acceso."},{"pregunta":"Cuál es un posible caso de uso de Amazon Aurora?","opciones":["Almacenar datos estáticos de acceso poco frecuente y que requieren capacidades de procesamiento mínimas","Sustituir los motores de bases de datos comerciales de alto costo por una solución más rentable que siga proporcionando un rendimiento y una fiabilidad de nivel empresarial","Procesar flujos de datos no estructurados en tiempo real sin restricciones de bases de datos relacionales","Ejecutar bases de datos temporales con requisitos mínimos de disponibilidad para entornos de desarrollo"],"correcta":"B","explicacion":"Aurora proporciona un rendimiento comparable al de las bases de datos comerciales de alta gama, pero a una décima parte del costo, lo que lo hace ideal para las organizaciones que buscan reducir los costos de las bases de datos sin sacrificar el rendimiento."},{"pregunta":"Cuál es la explicación que MEJOR describe Amazon RDS?","opciones":["Un sistema de base de datos NoSQL optimizado para datos no estructurados","Un servicio de almacenamiento de caché en memoria completamente administrado que se integra perfectamente con Redis, Valkey o Memcached","Un servicio completamente administrado que ayuda a configurar, operar y escalar bases de datos relacionales en la nube","Una solución de almacenamiento de datos para el procesamiento analítico"],"correcta":"C","explicacion":"Amazon RDS es un servicio de base de datos completamente administrado en la nube de AWS que libera a los usuarios de la mayoría de las tareas de administración y ayuda a configurar, operar y escalar las bases de datos en la nube."},{"pregunta":"Cuál es un caso de uso práctico de Amazon DocumentDB (compatible con MongoDB)?","opciones":["Almacenamiento de caché en memoria en tiempo real de los datos de las sesiones web","Almacenamiento de archivos a largo plazo de datos históricos con patrones de acceso poco frecuente","Ejecución de aplicaciones bancarias transaccionales de alto rendimiento con estrictos requisitos de cumplimiento","Almacenamiento y administración de un gran catálogo de productos para una aplicación de comercio electrónico"],"correcta":"D","explicacion":"Amazon DocumentDB se destaca en el manejo de datos semiestructurados, como los catálogos de productos."},{"pregunta":"¿Qué definición describe MEJOR el almacenamiento de caché en memoria?","opciones":["Un sistema de administración de bases de datos que almacena permanentemente todos los datos de las aplicaciones en unidades de estado sólido para lograr velocidades de recuperación consistentes","Una solución de redes que optimiza las rutas de enrutamiento de internet para reducir la latencia entre las solicitudes de los usuarios y las aplicaciones basadas en la nube","Un servicio de copia de seguridad y recuperación que crea automáticamente instantáneas de datos críticos cada cinco minutos para evitar la pérdida","Un servicio basado en la nube que almacena los datos en la memoria para un acceso rápido, lo que mejora el rendimiento y la escalabilidad de las aplicaciones y reduce la carga de la base de datos"],"correcta":"D","explicacion":"El almacenamiento de caché en memoria es un servicio que almacena los datos de uso frecuente en la memoria para mejorar el rendimiento de las aplicaciones y reducir la necesidad de obtener datos de un almacenamiento basado en disco que es más lento."},{"pregunta":"¿Qué enunciado describe MEJOR Amazon DynamoDB?","opciones":["DynamoDB es una base de datos orientada a columnas que requiere la definición del esquema antes de almacenar los datos.","DynamoDB es un servicio de base de datos relacional que proporciona capacidades de consulta SQL complejas.","DynamoDB es una base de datos de documentos y clave-valor NoSQL completamente administrada que proporciona un rendimiento rápido y predecible con una escalabilidad perfecta.","DynamoDB es una base de datos de gráficos completamente administrada que requiere mantenimiento del servidor durante el tiempo de inactividad programado."],"correcta":"C","explicacion":"DynamoDB es un servicio de bases de datos NoSQL completamente administrado que ofrece modelos de datos de documentos y clave-valor con un rendimiento rápido y predecible, incluso a escala."},{"pregunta":"¿Qué problema resuelve AWS Database Migration Service (AWS DMS)?","opciones":["Crear programas automatizados de copia de seguridad de bases de datos","Proporcionar una interfaz gráfica para que los administradores de bases de datos diseñen tablas","Minimizar el tiempo de inactividad de las aplicaciones durante las migraciones de bases de datos","Optimizar las consultas SQL para mejorar el rendimiento de la base de datos"],"correcta":"C","explicacion":"Un beneficio clave de AWS DMS es que la base de datos fuente permanece en pleno funcionamiento durante la migración, lo que minimiza el tiempo de inactividad de las aplicaciones."}]},{"id":"aws-m8","modulo":8,"titulo":"IA, ML y analítica de datos","descripcion":"SageMaker, Bedrock, Amazon Q, servicios de IA prediseñados y analítica de datos.","notaMinima":70,"preguntas":[{"pregunta":"El proceso de extraer, transformar y cargar (ETL) se utiliza con frecuencia para proporcionar datos limpios y accesibles en un formato que puedan utilizar las herramientas de análisis y los algoritmos de IA.\n\n¿Cómo puede una canalización de datos mejorar este proceso?","opciones":["Las canalizaciones de datos aumentan la cantidad de datos sin procesar que se recopilan.","Las canalizaciones de datos eliminan la necesidad de transformar datos.","Las canalizaciones de datos hacen que el proceso de ETL sea más eficiente y repetible.","Las canalizaciones de datos reducen la variedad de orígenes de datos que se utilizan en el proceso de ETL."],"correcta":"C","explicacion":"Las canalizaciones de datos son líneas de ensamblaje automatizadas que se usan para hacer que el proceso de ETL sea eficaz y repetible. AWS cuenta con un conjunto de servicios integrados que puede utilizar para crear sus propias canalizaciones de datos."},{"pregunta":"Amazon Bedrock es un servicio completamente administrado que se diseñó específicamente para trabajar con modelos fundacionales (FM) de gran tamaño y crear aplicaciones de IA generativa.\n\n¿Qué ofrece el servicio para poder acceder a los FM de Amazon y de las principales startups de IA?","opciones":["Una única API","Un repositorio de código abierto","Uso gratuito e ilimitado","Almacenamiento dedicado en la nube"],"correcta":"A","explicacion":"Amazon Bedrock proporciona acceso a los FM de Amazon y de las principales startups de IA, como Claude y Stable Diffusion, todo a través de una API unificada."},{"pregunta":"La IA generativa es un tipo de aprendizaje profundo impulsado por modelos de machine learning (ML) extremadamente grandes, conocidos como modelos fundacionales (FM).\n\n¿Qué características tienen los FM? (Seleccione DOS opciones).","opciones":["Los FM reciben entrenamiento previo con vastas colecciones de datos.","Los FM se programan con reglas explícitas.","Los FM se utilizan únicamente para crear imágenes.","Los FM están entrenados para realizar tareas particulares.","Los FM se pueden adaptar para realizar varias tareas."],"correcta":["A","E"],"tipo":"multiple"},{"pregunta":"Los datos pueden provenir de muchas fuentes diferentes. Para proporcionar información, los datos deben estar consolidados en una sola ubicación. Para esto, existen dos opciones de almacenamiento. Los lagos de datos almacenan grandes cantidades de datos sin procesar, mientras que los almacenes de datos están optimizados para la inteligencia empresarial.\n\n¿Qué servicios de AWS se suelen utilizar como lagos y almacenes de datos?","opciones":["Amazon S3 es una opción popular para los lagos de datos, mientras que Amazon Redshift es un servicio de almacén de datos.","Amazon S3 es una opción popular para los lagos de datos, mientras que Amazon Athena es un servicio de almacén de datos.","Amazon EMR es una opción popular para los lagos de datos, mientras que Amazon Redshift es un servicio de almacén de datos.","Amazon Redshift es una opción popular para los lagos de datos, mientras que Amazon S3 es un servicio de almacén de datos."],"correcta":"A","explicacion":"Amazon S3 puede almacenar casi cualquier cantidad de datos estructurados o no estructurados, lo que lo convierte en una buena opción para los lagos de datos. Amazon Redshift es un servicio de almacén de datos completamente administrado y optimizado para inteligencia empresarial."},{"pregunta":"Una empresa de servicios financieros está desarrollando una aplicación que analice los datos bursátiles en tiempo real para que su equipo de analistas pueda tomar decisiones comerciales inmediatas. La empresa necesita hacer una ingesta de datos bursátiles en tiempo real sin preocuparse por los servidores ni la capacidad de escalado.\n\n¿Qué servicio de AWS sería acorde a sus necesidades?","opciones":["Amazon EMR","Amazon Athena","Amazon Kinesis Data Streams","Amazon QuickSight"],"correcta":"C","explicacion":"Este servicio sin servidor puede utilizarse para la ingesta en tiempo real de terabytes de datos de aplicaciones, transmisiones y sensores. Incluso proporciona aprovisionamiento y escalado automáticos."},{"pregunta":"Tanto la programación clásica como el machine learning se pueden utilizar para entrenar a los equipos a fin de que realicen tareas.\n\n¿Cuál es la principal diferencia entre estos dos enfoques?","opciones":["La programación clásica se utiliza para operaciones matemáticas, mientras que el machine learning se utiliza exclusivamente para el reconocimiento de patrones en imágenes y texto.","La programación clásica se utiliza para tareas sencillas, mientras que el machine learning se reserva para tareas extremadamente complejas.","La programación clásica establece reglas explícitas que el equipo debe seguir. En el machine learning, los equipos hacen predicciones mediante patrones aprendidos de datos históricos.","La programación clásica requiere más recursos computacionales que el machine learning, lo que la hace menos eficiente para tareas complejas."],"correcta":"C","explicacion":"Esto representa la diferencia fundamental entre la programación clásica y el machine learning."},{"pregunta":"¿Qué servicio de AWS se puede utilizar para crear, entrenar e implementar un modelo de machine learning (ML) personalizado sin tener que preocuparse por la infraestructura subyacente?","opciones":["IA de Amazon SageMaker","Amazon EMR","Amazon Personalize","Amazon Comprehend"],"correcta":"A","explicacion":"La IA de Amazon SageMaker ofrece un enfoque personalizado para el desarrollo de modelos de ML sin tener que preocuparse por la infraestructura subyacente."},{"pregunta":"Una amplia organización de sanidad desea mejorar la productividad de sus empleados. La empresa busca un asistente de IA generativa prediseñado que pueda responder preguntas, ayudar a resolver problemas y realizar acciones con los datos y la experiencia que se encuentran en sus repositorios de información.\n\n¿Qué servicio de AWS podría ser de ayuda en este caso de uso?","opciones":["Amazon Q Business","Amazon Q Developer","Amazon SageMaker JumpStart","Amazon Bedrock"],"correcta":"A","explicacion":"Amazon Q Business puede responder a preguntas urgentes, ayudar a resolver problemas y realizar acciones con los datos y la experiencia que se encuentran en los repositorios de información de su empresa. Es una elección ideal para este caso de uso."},{"pregunta":"Un pequeño equipo de desarrollo busca agregar una característica a su aplicación que pueda convertir el texto a voz.\n\n¿Qué servicio prediseñado de la IA de AWS se puede utilizar para esta tarea?","opciones":["Amazon Textract","Amazon Personalize","Amazon Polly","Amazon Comprehend"],"correcta":"C","explicacion":"Amazon Polly es un servicio de conversión de texto a voz que transforma el texto escrito en audio hablado realista para aplicaciones habilitadas para voz."},{"pregunta":"Una empresa de comercio electrónico desea agregar un motor de recomendación de productos a su aplicación en línea para aumentar las ventas. El equipo de desarrollo quiere que estas recomendaciones sean relevantes para cada cliente.\n\n¿Qué servicio prediseñado de la IA de AWS sería útil en este caso de uso?","opciones":["Amazon Comprehend","Amazon Kendra","Amazon Personalize","Amazon Lex"],"correcta":"C","explicacion":"Amazon Personalize se puede usar para agregar recomendaciones personalizadas de clientes a las aplicaciones. Es una buena opción para este caso de uso."}]},{"id":"aws-m9","modulo":9,"titulo":"Seguridad","descripcion":"IAM, MFA, KMS, Shield, WAF, GuardDuty, Inspector y Macie.","notaMinima":70,"preguntas":[{"pregunta":"Cuál es la responsabilidad que tiene AWS según el modelo de responsabilidad compartida?","opciones":["Configurar grupos de seguridad para instancias de Amazon EC2","Cifrar los datos en reposo de los clientes","Administrar la seguridad física de los centros de datos","Configurar los roles y las políticas de AWS Identity and Access Management (AWS IAM)"],"correcta":"C","explicacion":"AWS administra todos los aspectos de la seguridad física de los centros de datos, incluidos los controles de acceso a las instalaciones, las medidas de protección del entorno, la redundancia de energía y los sistemas de vigilancia."},{"pregunta":"Un empleado desea consultar el portal de empleados en línea de su empresa para ver cuántas horas de vacaciones acumuló. Antes de acceder a sus registros personales, ingresa su nombre de usuario y contraseña para iniciar sesión en el sitio.\n\n¿Qué sucede durante este proceso de inicio de sesión?","opciones":["Autenticación","Autorización","Detección","Cifrado"],"correcta":"A","explicacion":"La autenticación es el proceso mediante el que se pide al usuario que proporcione credenciales, como un nombre de usuario y una contraseña, para verificar su identidad."},{"pregunta":"El equipo de seguridad de una gran empresa de comercio electrónico necesita una forma centralizada de crear y administrar claves de cifrado que protejan sus datos en AWS.\n\n¿Cuál de estos servicios representa la MEJOR opción para esto?","opciones":["Amazon Macie","AWS Key Management Service (AWS KMS)","AWS WAF","AWS Certificate Manager (ACM)"],"correcta":"B","explicacion":"AWS KMS está diseñado específicamente para crear y administrar claves de cifrado."},{"pregunta":"El equipo de seguridad de una gran empresa de desarrollo de software necesita comprobar si hay vulnerabilidades de seguridad y desviaciones de las prácticas recomendadas de seguridad en varias aplicaciones. Las aplicaciones se ejecutan en Amazon EC2, AWS Lambda y en contenedores.\n\n¿Qué servicio de AWS deberían utilizar para estas evaluaciones de seguridad?","opciones":["Amazon Detective","Amazon Inspector","AWS Security Hub","Amazon GuardDuty"],"correcta":"B","explicacion":"Amazon Inspector está diseñado específicamente para realizar evaluaciones automatizadas de vulnerabilidades en aplicaciones alojadas en AWS."},{"pregunta":"Todas las cuentas de AWS reciben un usuario raíz. El usuario raíz es el propietario de la cuenta y tiene permiso para realizar cualquier acción.\n\n¿Cuáles son algunas maneras de proteger esta cuenta privilegiada? (Seleccione DOS opciones).","opciones":["Delegar el acceso del usuario raíz a otros usuarios.","Activar la autenticación multifactor (MFA).","Eliminar el usuario raíz después de configurar los usuarios de AWS Identity and Access Management (AWS IAM).","Asociar una contraseña segura a la cuenta.","Crear varios usuarios raíz para lograr redundancia."],"correcta":["B","D"],"tipo":"multiple","explicacion":"Para proteger al usuario raíz, se recomienda asociar una contraseña segura a la cuenta y activar la MFA. Una cuenta de AWS puede tener un solo usuario raíz. Este usuario raíz no se puede eliminar y su acceso no debe delegarse a otros nunca."},{"pregunta":"La protección de los datos confidenciales de los clientes es un componente vital para mantener su confianza. Esto implica cifrar los datos tanto en reposo como en tránsito.\n\n¿Qué se utiliza para cifrar los datos en tránsito?","opciones":["Autenticación multifactor (MFA)","Los certificados SSL/TLS","Contraseñas seguras","Claves criptográficas"],"correcta":"B","explicacion":"SSL y su sucesor, TLS, son protocolos diseñados específicamente para cifrar los datos a medida que se mueven por medio de redes entre sistemas."},{"pregunta":"Con AWS Identity and Access Management (AWS IAM), todas las acciones se deniegan de forma predeterminada. Al conceder permisos, el acceso debe proporcionarse únicamente cuando sea necesario.\n\n¿Cómo se denomina este concepto?","opciones":["Política de denegación predeterminada","Control de acceso basado en roles","Marco de trabajo de los límites de permiso","Principio de mínimo privilegio"],"correcta":"D","explicacion":"El principio de mínimo privilegio establece que las personas y los sistemas deben tener acceso únicamente a lo que necesitan y nada más."},{"pregunta":"Una gran empresa de marketing tiene un conjunto estándar de permisos que se usan para conceder a los diseñadores acceso a determinados buckets de Amazon S3. La empresa agregó un nuevo bucket de S3 al que todos los diseñadores deben acceder.\n\n¿Qué control de AWS Identity and Access Management (AWS IAM) puede utilizar la empresa para asignar permisos que heredarán todos los diseñadores?","opciones":["Usuario de IAM","Grupo de IAM","Política de IAM","Rol de IAM"],"correcta":"B","explicacion":"Los grupos de IAM están diseñados específicamente para estos casos. Se utilizan para dar permisos a varios usuarios a la vez."},{"pregunta":"Recientemente, una pequeña empresa de servicios financieros trasladó sus recursos en línea a AWS. El equipo de seguridad estaba preocupado por la protección frente a los tipos más comunes y frecuentes de ataques de denegación de servicio distribuida (DDoS).\n\n¿Qué servicio de AWS protege a los clientes de los ataques DDoS de forma automática y sin costo alguno?","opciones":["AWS Systems Manager","Amazon Macie","AWS Shield","AWS Identity and Access Management (AWS IAM)"],"correcta":"C","explicacion":"Shield es un servicio de protección frente a ataques DDoS administrado que protege las aplicaciones que se ejecutan en AWS de los tipos de ataques DDoS más comunes y frecuentes sin costo alguno."},{"pregunta":"Una empresa de tecnología está trasladando algunos de sus recursos a AWS. La empresa quiere ofrecer acceso de inicio de sesión único a sus empleados en AWS mediante su fuente de identidad existente.\n\n¿Qué servicio ayudaría a la empresa a lograr esto?","opciones":["AWS Systems Manager","AWS IAM Identity Center","AWS Secrets Manager","AWS Identity and Access Management (AWS IAM)"],"correcta":"B","explicacion":"IAM Identity Center está diseñado específicamente para ayudar a las organizaciones a implementar el inicio de sesión único para los recursos de AWS mediante sus proveedores de identidad existentes."}]},{"id":"aws-m10","modulo":10,"titulo":"Monitorización y gobernanza","descripcion":"CloudWatch, CloudTrail, Config, Artifact, Organizations y Trusted Advisor.","notaMinima":70,"preguntas":[{"pregunta":"Cuál es el propósito de una zona de aterrizaje de AWS Control Tower?","opciones":["Filtra el tráfico entrante y saliente a las instancias de Amazon EC2 en una nube virtual privada (VPC).","Es una subsección de una nube virtual privada (VPC) donde puede aislar los recursos y controlar el acceso.","Se trata de una sección aislada de forma lógica de la nube de AWS donde puede lanzar recursos de AWS en una red virtual que usted mismo defina.","Es el contenedor de toda la empresa que alberga todas las unidades organizativas (UO), cuentas, usuarios y recursos que desea regular para garantizar el cumplimiento."],"correcta":"D","explicacion":"Una zona de aterrizaje es un entorno de cuentas múltiples bien diseñado que se basa en las prácticas recomendadas de seguridad y cumplimiento. Es el contenedor donde guarda todos los recursos que desea regular para su cumplimiento."},{"pregunta":"Un cliente de investigación con un gran equipo de desarrolladores necesita una forma de garantizarles pautas de configuración específicas a la hora de crear recursos de AWS. Quiere una forma de evaluar y auditar los recursos de AWS para asegurarse de que el equipo utilice la lista aprobada de recursos de computación más rentable.\n\n¿Qué solución o característica cubriría sus necesidades?","opciones":["AWS Audit Manager","AWS Artifact","AWS CloudTrail","AWS Config"],"correcta":"D","explicacion":"AWS Config es la mejor opción porque evaluará, auditará y evaluará las configuraciones de los recursos de AWS del desarrollador."},{"pregunta":"Un cliente utiliza AWS Organizations para administrar de forma centralizada las cuentas de su empresa en cuanto a la facturación para optimizar y organizar los costos. Quiere establecer reglas o restricciones en los servicios, los recursos y las acciones individuales de la API de AWS a los que los usuarios pueden acceder.\n\n¿Qué característica cubriría sus necesidades?","opciones":["Una cuenta raíz","Usuario de AWS Identity and Access Management (AWS IAM)","Una unidad organizativa (UO)","Una política de control de servicios (SCP)"],"correcta":"D","explicacion":"Una SCP es una política que le permite restringir los servicios, los recursos y las acciones individuales de la API de AWS a los que pueden acceder los usuarios y los roles de cada cuenta. Las SCP se pueden aplicar a las UO o a las cuentas de miembros individuales."},{"pregunta":"Una empresa financiera con una solución de nube híbrida desea realizar un seguimiento de los cambios realizados en sus recursos de AWS tanto en la nube como en las instalaciones. En concreto, quieren saber quién hizo qué y cuándo.\n\n¿Qué servicio de AWS se adaptaría mejor a sus necesidades?","opciones":["AWS CloudTrail","AWS Trusted Advisor","Amazon CloudWatch","AWS Artifact"],"correcta":"A","explicacion":"CloudTrail es un servicio de AWS que utiliza las API para rastrear quién hizo qué, cuándo se produjo la acción y en qué servicios y recursos de AWS."},{"pregunta":"¿Qué servicio de AWS proporciona evaluaciones y comprobaciones continuas de sus recursos de AWS y ofrece sugerencias para optimizar los costos, el rendimiento, la seguridad y la resiliencia?","opciones":["AWS Trusted Advisor","AWS CloudTrail","AWS Artifact","Amazon CloudWatch"],"correcta":"A","explicacion":"Trusted Advisor le ayuda a optimizar los costos, aumentar el rendimiento, mejorar la seguridad y la resiliencia y operar a escala en la nube."},{"pregunta":"¿Qué servicio de AWS proporciona acceso gratuito y bajo demanda a los informes de seguridad y cumplimiento de AWS y a determinados acuerdos en línea?","opciones":["Amazon CloudWatch","AWS Artifact","AWS Trusted Advisor","AWS CloudTrail"],"correcta":"B","explicacion":"AWS Artifact es un portal de autoservicio que proporciona acceso bajo demanda a la documentación de seguridad y cumplimiento de AWS, incluidos los informes."},{"pregunta":"¿Dónde pueden los clientes encontrar recursos sobre el cumplimiento de AWS, por ejemplo, información sobre historias de cumplimiento de los clientes, respuestas a preguntas clave sobre cumplimiento y una lista de comprobación de seguridad para auditorías?","opciones":["AWS Organizations","AWS Artifact","Centro de conformidad para clientes","Consola de administración de AWS"],"correcta":"C","explicacion":"El Centro de conformidad para clientes proporciona recursos que le ayudarán a obtener más información sobre el cumplimiento de AWS. Puede leer las historias de cumplimiento de los clientes para descubrir cómo las empresas de los sectores regulados resolvieron varios desafíos de cumplimiento, gobernanza y auditoría."},{"pregunta":"Una empresa de ropa deportiva aloja su aplicación en instancias de Amazon EC2. Quiere recopilar métricas de sus instancias de EC2 y desea recibir notificaciones cuando la utilización supere los umbrales. También desea configurar una acción para automatizar el aumento vertical del número de instancias de EC2 cuando la utilización supere su umbral.\n\n¿Qué servicio de AWS se adaptaría mejor a sus necesidades?","opciones":["AWS Artifact","Amazon CloudWatch","AWS CloudTrail","AWS Trusted Advisor"],"correcta":"B","explicacion":"CloudWatch puede recopilar las métricas de las instancias de EC2, proporcionar información mediante paneles, establecer alarmas en los umbrales y automatizar las instancias de EC2 adicionales."},{"pregunta":"Un cliente empresarial creció rápidamente y tiene dificultades para administrar la facturación de sus cuentas y recursos de AWS. Todos los empleados crearon cuentas independientes sin una administración centralizada ni agrupaciones jerárquicas de cuentas. El cliente desea unificar la facturación y centralizar la administración en unidades organizativas.\n\n¿Qué servicio de AWS se adaptaría mejor a las necesidades de este cliente?","opciones":["AWS Organizations","AWS Service Catalog","Una zona de disponibilidad (AZ)","AWS Trusted Advisor"],"correcta":"A","explicacion":"Con Organizations, puede administrar su entorno de forma centralizada a medida que escala sus recursos de AWS. Se puede usar para centralizar la administración, consolidar la facturación e implementar agrupaciones jerárquicas de cuentas."},{"pregunta":"Una empresa financiera busca una solución con el fin de controlar un conjunto seleccionado de recursos de AWS para sus empleados. Cuando los empleados necesitan seleccionar e iniciar un nuevo recurso de AWS, la empresa quiere ofrecer una forma de autoservicio para crear, compartir e implementar los recursos de AWS.\n\n¿Qué servicio de AWS se adaptaría mejor a sus necesidades?","opciones":["AWS Health","AWS Service Catalog","AWS License Manager","AWS Artifact"],"correcta":"B","explicacion":"Con Service Catalog, puede crear, compartir y organizar a partir de un catálogo seleccionado de recursos de AWS. Puede implementar herramientas de seguridad y recursos de red básicos para las nuevas cuentas de AWS, de modo que pueda controlar de manera coherente."},{"pregunta":"Un cliente se está trasladando de un entorno en las instalaciones a la nube y decidió utilizar el enfoque del modelo Bring Your Own License (BYOL) para ahorrar costos. Le preocupa la administración de las licencias, quiere una forma de reducir el riesgo de incumplimiento y desea aplicar límites de uso para las licencias.\n\n¿Qué solución se adaptaría mejor a sus necesidades?","opciones":["AWS Organizations","AWS Service Catalog","AWS License Manager","AWS Control Tower"],"correcta":"C","explicacion":"License Manager ayuda a reducir el riesgo de incumplimiento al aplicar los límites de uso de las licencias, bloquear los nuevos lanzamientos y utilizar otros controles."}]},{"id":"aws-m11","modulo":11,"titulo":"Precios y soporte","descripcion":"Modelos de precios, facturación, presupuestos, calculadora y planes de soporte.","notaMinima":70,"preguntas":[{"pregunta":"Imagine que es el líder técnico de una empresa de comercio electrónico de tamaño mediano y está evaluando varias opciones de soporte para su infraestructura de AWS. Sus desafíos actuales incluyen la optimización del rendimiento de la base de datos y la planificación de la respuesta a los incidentes. También busca asesoramiento técnico sobre las prácticas recomendadas de seguridad.\n\nAdemás de los planes de AWS Support, ¿qué opción de soporte es la MEJOR para obtener asesoramiento sobre las prácticas recomendadas de seguridad y realizar una auditoría de seguridad de su entorno de AWS?","opciones":["AWS Basic Support","AWS re:Post","AWS Professional Services","Equipo de confianza y seguridad de AWS"],"correcta":"C","explicacion":"AWS Professional Services ofrece una amplia experiencia técnica y puede ayudar con auditorías de seguridad, prácticas recomendadas y orientación estratégica adaptadas a las necesidades específicas."},{"pregunta":"Es el director de tecnología de una gran empresa con aplicaciones esenciales que se ejecutan en AWS. Su organización requiere el más alto nivel de soporte, incluidos tiempos de respuesta de 15 minutos o menos cuando los sistemas de importancia crítica no funcionan.\n\n¿Qué plan de AWS Support debe elegir?","opciones":["Business Support","Enterprise Support","Developer Support","Basic Support"],"correcta":"B","explicacion":"Enterprise Support está diseñado para grandes empresas que tienen aplicaciones esenciales para su negocio. Ofrece el más alto nivel de soporte, incluidos tiempos de respuesta rápidos, supervisión proactiva y acceso a una amplia gama de servicios y características de AWS. Además, proporciona orientación de los expertos de AWS para ayudar a garantizar un rendimiento y una seguridad óptimos."},{"pregunta":"Imagine que forma parte de un equipo que desea supervisar y administrar los costos de varias cuentas de AWS en diferentes departamentos de su organización.\n\n¿Qué servicio de AWS puede utilizar para administrar y consolidar de forma eficaz la información de facturación de estas cuentas?","opciones":["AWS Budgets","AWS Organizations","Panel de administración de facturación y costos de AWS","Explorador de costos de AWS"],"correcta":"B","explicacion":"AWS Organizations está diseñado para ayudarle a administrar varias cuentas de AWS, incluida la consolidación de la información de facturación, la configuración de políticas y la aplicación de la gobernanza en toda la organización."},{"pregunta":"Una empresa financiera global actualmente tiene sus recursos de tecnología de la información (TI) en las instalaciones y está evaluando utilizar la nube de AWS. La empresa está acostumbrada a las inversiones de capital fijas y quiere saber cómo pagarían si se trasladaran a la nube de AWS.\n\n¿Cuáles son las opciones que MEJOR describen la forma en que los clientes pagan por AWS? (Seleccione TRES opciones).","opciones":["Pago por uso","Ahorro cuando se compromete","Ahorro a través de gastos fijos","Firma de contratos fijos","Más uso, menos dinero","Pago total anticipado"],"correcta":["A","B","E"],"tipo":"multiple","explicacion":"Cuando se trata de los precios de AWS, los clientes pagan por uso y pueden ahorrar cuando se comprometen a una cantidad específica de uso durante un período de tiempo determinado. También pueden recibir descuentos por volumen a medida que aumentan el uso."},{"pregunta":"Además de los planes de AWS Support y otras opciones de asistencia técnica, AWS también proporciona acceso a recursos de autoayuda.\n\n¿Qué opciones tienen di   <script>
/* === formato.js === */
/**
 * formato.js
 * Normaliza y valida el JSON de un modulo.
 *
 * Formato recomendado (ver modules/_PLANTILLA.json):
 * {
 *   "id": "aws-m1",
 *   "titulo": "Introduccion a la nube",
 *   "descripcion": "...",
 *   "etiqueta": "Modulo 1",
 *   "preguntas": [
 *     {
 *       "pregunta": "...",
 *       "opciones": ["...", "...", "...", "..."],
 *       "correcta": "A",              // o ["A", "C"] para varias
 *       "explicacion": "..."          // opcional
 *     }
 *   ]
 * }
 *
 * Se aceptan sinonimos en ingles y otras formas de marcar la respuesta;
 * todo se reduce a la estructura interna que usa la aplicacion.
 */

const LETRAS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const letra = (i) => LETRAS[i] ?? `#${i + 1}`;

/** Devuelve el primer valor no vacio entre varias claves posibles. */
function elegir(obj, claves) {
  for (const clave of claves) {
    const valor = obj?.[clave];
    if (valor !== undefined && valor !== null && valor !== "") return valor;
  }
  return undefined;
}

const texto = (valor) => (typeof valor === "string" ? valor.trim() : "");

/** Convierte las opciones a un array de { texto, correctaInline }. */
function leerOpciones(bruto) {
  if (Array.isArray(bruto)) {
    return bruto.map((op) => {
      if (op && typeof op === "object") {
        return {
          texto: texto(elegir(op, ["texto", "text", "opcion", "label", "valor"])),
          correctaInline: Boolean(elegir(op, ["correcta", "correcto", "esCorrecta", "correct", "isCorrect"])),
        };
      }
      return { texto: String(op ?? "").trim(), correctaInline: false };
    });
  }

  // Forma { "A": "texto", "B": "texto" }
  if (bruto && typeof bruto === "object") {
    return Object.keys(bruto)
      .sort()
      .map((clave) => ({ texto: String(bruto[clave] ?? "").trim(), correctaInline: false }));
  }

  return [];
}

/** Traduce una referencia de respuesta a indice de opcion. */
function resolverIndice(valor, opciones, numerosBaseCero) {
  if (typeof valor === "number" && Number.isFinite(valor)) {
    const idx = numerosBaseCero ? valor : valor - 1;
    return idx >= 0 && idx < opciones.length ? idx : -1;
  }

  const bruto = String(valor ?? "").trim();
  if (!bruto) return -1;

  // Letra suelta: A, b, C...
  if (/^[A-Za-z]$/.test(bruto)) {
    const idx = LETRAS.indexOf(bruto.toUpperCase());
    return idx >= 0 && idx < opciones.length ? idx : -1;
  }

  // Numero escrito como texto
  if (/^\d+$/.test(bruto)) {
    return resolverIndice(Number(bruto), opciones, numerosBaseCero);
  }

  // Texto exacto de la opcion (sin distinguir mayusculas ni espacios extra)
  const normal = bruto.toLowerCase().replace(/\s+/g, " ");
  const idx = opciones.findIndex((op) => op.texto.toLowerCase().replace(/\s+/g, " ") === normal);
  return idx;
}

/** Reune todas las referencias de respuesta declaradas en la pregunta. */
function leerReferencias(pregunta) {
  const bruto = elegir(pregunta, [
    "correcta", "correctas", "correcto", "correctos",
    "respuesta", "respuestas", "solucion",
    "answer", "answers", "correct",
  ]);

  if (bruto === undefined) return [];

  const lista = Array.isArray(bruto) ? bruto : [bruto];

  // "A,C" o "A y C" en una sola cadena
  return lista.flatMap((valor) => {
    if (typeof valor === "string" && /[,;]/.test(valor)) {
      return valor.split(/[,;]+/).map((parte) => parte.trim()).filter(Boolean);
    }
    return [valor];
  });
}

function normalizarPregunta(bruta, i, errores) {
  const donde = `Pregunta ${i + 1}`;
  const enunciado = texto(elegir(bruta, ["pregunta", "enunciado", "question", "texto", "text", "titulo"]));
  if (!enunciado) errores.push(`${donde}: falta el texto de la pregunta ("pregunta").`);

  const opciones = leerOpciones(elegir(bruta, ["opciones", "options", "respuestas", "alternativas", "choices"]));
  if (opciones.length < 2) errores.push(`${donde}: se necesitan al menos 2 opciones ("opciones").`);
  if (opciones.some((op) => !op.texto)) errores.push(`${donde}: hay opciones vacías.`);

  const correctas = new Set();

  // 1) Opciones marcadas con "correcta": true
  opciones.forEach((op, idx) => {
    if (op.correctaInline) correctas.add(idx);
  });

  // 2) Campo "correcta" / "respuesta" / ...
  const referencias = leerReferencias(bruta);
  const numeros = referencias.filter((r) => typeof r === "number" || /^\d+$/.test(String(r).trim()));
  // Si aparece un 0, el autor cuenta desde 0; si no, desde 1 (1 = A).
  const baseCero = numeros.some((r) => Number(r) === 0);

  for (const ref of referencias) {
    const idx = resolverIndice(ref, opciones, baseCero);
    if (idx < 0) {
      errores.push(`${donde}: no se entiende la respuesta "${ref}". Usa una letra (A, B, C...) o el texto exacto de la opción.`);
    } else {
      correctas.add(idx);
    }
  }

  if (correctas.size === 0 && referencias.length === 0 && opciones.length >= 2) {
    errores.push(`${donde}: falta indicar la respuesta correcta ("correcta": "A").`);
  }

  const tipoDeclarado = texto(elegir(bruta, ["tipo", "type"])).toLowerCase();
  const multiple = tipoDeclarado
    ? /multi|varias|multiple/.test(tipoDeclarado)
    : correctas.size > 1;

  return {
    id: texto(elegir(bruta, ["id"])) || `p${i + 1}`,
    enunciado,
    opciones: opciones.map((op) => op.texto),
    correctas: [...correctas].sort((a, b) => a - b),
    multiple,
    explicacion: texto(elegir(bruta, ["explicacion", "explicación", "explanation", "porque", "porqué", "razon", "razón", "justificacion", "motivo"])),
  };
}

/**
 * @returns {{ ok: boolean, modulo: object|null, errores: string[] }}
 */
function normalizarModulo(bruto, { idPorDefecto = "" } = {}) {
  const errores = [];

  if (!bruto || typeof bruto !== "object" || Array.isArray(bruto)) {
    return { ok: false, modulo: null, errores: ['El archivo debe ser un objeto JSON con "titulo" y "preguntas".'] };
  }

  const titulo = texto(elegir(bruto, ["titulo", "título", "title", "nombre", "tema"]));
  if (!titulo) errores.push('Falta el título del módulo ("titulo").');

  const brutoPreguntas = elegir(bruto, ["preguntas", "questions", "items"]);
  if (!Array.isArray(brutoPreguntas) || brutoPreguntas.length === 0) {
    errores.push('Falta la lista de preguntas ("preguntas": [ ... ]).');
  }

  const preguntas = Array.isArray(brutoPreguntas)
    ? brutoPreguntas.map((p, i) => normalizarPregunta(p ?? {}, i, errores))
    : [];

  const numero = elegir(bruto, ["modulo", "módulo", "numero", "número", "orden", "module"]);
  const etiqueta =
    texto(elegir(bruto, ["etiqueta", "label", "badge"])) ||
    (numero !== undefined ? `Módulo ${numero}` : "");

  const modulo = {
    id: texto(elegir(bruto, ["id", "clave", "slug"])) || idPorDefecto || titulo.toLowerCase().replace(/[^a-z0-9]+/g, "-"),
    titulo,
    descripcion: texto(elegir(bruto, ["descripcion", "descripción", "description", "resumen", "subtitulo"])),
    etiqueta,
    orden: Number.isFinite(Number(numero)) ? Number(numero) : null,
    notaMinima: Number(elegir(bruto, ["notaMinima", "aprobadoEn", "minimo"]) ?? 70),
    barajarPreguntas: Boolean(elegir(bruto, ["barajarPreguntas", "shuffleQuestions", "barajar"])),
    barajarOpciones: Boolean(elegir(bruto, ["barajarOpciones", "shuffleOptions"])),
    preguntas,
  };

  return { ok: errores.length === 0, modulo: errores.length === 0 ? modulo : null, errores };
}

/**
 * auth.js
 * Identidad de Microsoft 365 usando la autenticacion incorporada de
 * Azure Static Web Apps: no hace falta registrar una app ni guardar secretos.
 *
 *   /.auth/me                -> quien ha iniciado sesion
 *   /.auth/login/aad         -> iniciar sesion con la cuenta Microsoft
 *   /.auth/logout            -> cerrar sesion
 *
 * staticwebapp.config.json ya obliga a iniciar sesion antes de servir la
 * pagina; esto solo sirve para pintar el nombre y el boton de salir.
 * Fuera de Static Web Apps (por ejemplo en local) se entra en "modo local".
 */

const RUTA_ME = "/.auth/me";

const URL_LOGIN = (destino = location.pathname) =>
  `/.auth/login/aad?post_login_redirect_uri=${encodeURIComponent(destino)}`;

const URL_LOGOUT = (destino = "/") =>
  `/.auth/logout?post_logout_redirect_uri=${encodeURIComponent(destino)}`;

function iniciales(nombre) {
  const partes = String(nombre || "?")
    .replace(/@.*$/, "")
    .split(/[\s._-]+/)
    .filter(Boolean);
  const letras = (partes[0]?.[0] ?? "?") + (partes[1]?.[0] ?? "");
  return letras.toUpperCase();
}

/**
 * @returns {Promise<{estado: 'dentro'|'fuera'|'local', nombre: string, iniciales: string, id: string}>}
 */
async function sesion() {
  try {
    const respuesta = await fetch(RUTA_ME, { headers: { accept: "application/json" } });
    if (!respuesta.ok) return { estado: "local", nombre: "Modo local", iniciales: "··", id: "local" };

    const tipo = respuesta.headers.get("content-type") || "";
    if (!tipo.includes("json")) return { estado: "local", nombre: "Modo local", iniciales: "··", id: "local" };

    const datos = await respuesta.json();
    const principal = datos?.clientPrincipal;
    if (!principal) return { estado: "fuera", nombre: "", iniciales: "?", id: "" };

    const nombre =
      principal.claims?.find((c) => /(^|\/)name$/.test(c.typ))?.val ||
      principal.userDetails ||
      "Cuenta Microsoft";

    return { estado: "dentro", nombre, iniciales: iniciales(nombre), id: principal.userId || nombre };
  } catch {
    // Sin backend de autenticacion (file://, servidor estatico simple, etc.)
    return { estado: "local", nombre: "Modo local", iniciales: "··", id: "local" };
  }
}


/* === datos.js === */
/**
 * datos.js
 * Carga del catalogo (modules/index.json + los archivos de cada modulo),
 * modulos anadidos desde el navegador y progreso guardado.
 */

const BASE = "modules/";
const CLAVE_LOCALES = "repasar:v1:modulos-locales";
const CLAVE_PROGRESO = "repasar:v1:progreso";

const sinCache = { cache: "no-cache", headers: { accept: "application/json" } };

async function leerJson(ruta) {
  const respuesta = await fetch(ruta, sinCache);
  if (!respuesta.ok) throw new Error(`No se pudo leer ${ruta} (HTTP ${respuesta.status})`);
  try {
    return await respuesta.json();
  } catch {
    throw new Error(`${ruta} no contiene JSON válido.`);
  }
}

/**
 * Version de un solo archivo (herramientas/empaquetar.py): los modulos vienen
 * incrustados en la propia pagina y no hace falta pedir nada al servidor.
 */
function leerIncrustado() {
  const etiqueta = document.getElementById("datos-modulos");
  if (!etiqueta) return null;
  try {
    return JSON.parse(etiqueta.textContent);
  } catch {
    return null;
  }
}

/**
 * Lee el catalogo completo. Nunca lanza: los problemas se devuelven en `errores`
 * para poder mostrarlos en pantalla sin romper el resto de modulos.
 */
async function cargarCatalogo() {
  const errores = [];
  let indice;

  const incrustado = leerIncrustado();
  if (incrustado) {
    const modulos = (incrustado.modulos || [])
      .map((bruto, i) => {
        const { ok, modulo, errores: fallos } = normalizarModulo(bruto, { idPorDefecto: `m${i + 1}` });
        if (!ok) {
          errores.push(`Módulo ${i + 1}: ${fallos.join(" ")}`);
          return null;
        }
        return { ...modulo, origen: "catalogo", orden: modulo.orden ?? i + 1 };
      })
      .filter(Boolean);
    return {
      config: { ...configPorDefecto(), ...incrustado },
      modulos: [...modulos, ...leerLocales()],
      errores,
    };
  }

  try {
    indice = await leerJson(`${BASE}index.json`);
  } catch (e) {
    return {
      config: configPorDefecto(),
      modulos: leerLocales(),
      errores: [`${e.message} Revisa que exista modules/index.json y que la página se sirva por HTTP.`],
    };
  }

  const config = { ...configPorDefecto(), ...indice };
  const entradas = Array.isArray(indice.modulos) ? indice.modulos : [];

  const cargados = await Promise.all(
    entradas.map(async (entrada, i) => {
      const archivo = typeof entrada === "string" ? entrada : entrada?.archivo || entrada?.file;
      if (!archivo) {
        errores.push(`Entrada ${i + 1} de index.json: falta el nombre del archivo.`);
        return null;
      }
      try {
        const bruto = await leerJson(BASE + archivo);
        const idPorDefecto = archivo.replace(/\.json$/i, "");
        const { ok, modulo, errores: fallos } = normalizarModulo(bruto, { idPorDefecto });
        if (!ok) {
          errores.push(`${archivo}: ${fallos.join(" ")}`);
          return null;
        }
        return { ...modulo, archivo, origen: "catalogo", orden: modulo.orden ?? i + 1 };
      } catch (e) {
        errores.push(e.message);
        return null;
      }
    })
  );

  const modulos = cargados.filter(Boolean);
  modulos.sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999));

  return { config, modulos: [...modulos, ...leerLocales()], errores };
}

function configPorDefecto() {
  return {
    marca: "Ruta de estudio",
    titulo: "¿Qué módulo quieres estudiar?",
    descripcion:
      "Selecciona un módulo. Recibirás retroalimentación inmediata y podrás repetirlo cuantas veces necesites.",
    // true | false | "local" (solo al abrirlo en tu equipo, no en el sitio publicado)
    permitirSubida: "local",
  };
}

/* -- Modulos anadidos desde el navegador ---------------------------------- */

function leerLocales() {
  try {
    const guardados = JSON.parse(localStorage.getItem(CLAVE_LOCALES) || "[]");
    return guardados
      .map((bruto, i) => {
        const { ok, modulo } = normalizarModulo(bruto, { idPorDefecto: `local-${i}` });
        return ok ? { ...modulo, origen: "local", orden: 900 + i } : null;
      })
      .filter(Boolean);
  } catch {
    return [];
  }
}

function escribirLocales(lista) {
  guardar(CLAVE_LOCALES, lista);
}

/** Escribe en localStorage sin romperse si el navegador no lo permite
 *  (modo privado, archivo abierto con doble clic, cuota agotada...). */
function guardar(clave, valor) {
  try {
    localStorage.setItem(clave, JSON.stringify(valor));
    return true;
  } catch {
    return false;
  }
}

function crudosLocales() {
  try {
    return JSON.parse(localStorage.getItem(CLAVE_LOCALES) || "[]");
  } catch {
    return [];
  }
}

/** Anade (o reemplaza, si coincide el id) un modulo en este navegador. */
function guardarLocal(bruto, id) {
  const lista = crudosLocales().filter((m) => (m.id || "") !== id);
  escribirLocales([...lista, bruto]);
}

function borrarLocal(id) {
  escribirLocales(crudosLocales().filter((m, i) => (m.id || `local-${i}`) !== id));
}

/* -- Progreso -------------------------------------------------------------- */

function leerProgreso() {
  try {
    return JSON.parse(localStorage.getItem(CLAVE_PROGRESO) || "{}");
  } catch {
    return {};
  }
}

function guardarProgreso(idModulo, resultado) {
  const todo = leerProgreso();
  const previo = todo[idModulo];
  todo[idModulo] = {
    ...resultado,
    fecha: new Date().toISOString(),
    mejor: Math.max(resultado.porcentaje, previo?.mejor ?? 0),
    intentos: (previo?.intentos ?? 0) + 1,
  };
  guardar(CLAVE_PROGRESO, todo);
}


/* === app.js === */
/**
 * app.js
 * Vistas de la aplicacion: catalogo de modulos, cuestionario y resultados.
 * Sin framework ni paso de compilacion: se sirve tal cual.
 */



const app = document.getElementById("app");
const barra = document.getElementById("barra");

const estado = {
  config: {},
  modulos: [],
  errores: [],
  usuario: null,
  quiz: null, // sesion de cuestionario en curso
};

/* == utilidades ============================================================ */

const esc = (valor) =>
  String(valor ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);

const plural = (n, singular, prural) => `${n} ${n === 1 ? singular : prural}`;

/** De un enunciado con contexto, se queda con la pregunta (el último párrafo). */
const soloPregunta = (texto) => texto.split(/\n{2,}/).filter((t) => t.trim()).pop() || texto;

function barajar(lista) {
  const copia = [...lista];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

function mismoConjunto(a, b) {
  if (a.length !== b.length) return false;
  const x = [...a].sort((m, n) => m - n);
  const y = [...b].sort((m, n) => m - n);
  return x.every((v, i) => v === y[i]);
}

function pintar(html) {
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/**
 * ¿Se puede añadir módulos desde el navegador?
 * En el sitio publicado no: el catálogo lo controla quien mantiene el repositorio.
 * Con "local" solo se permite al abrir la app en tu equipo o el archivo suelto,
 * que es como cada persona puede probar sus propios módulos.
 */
function sePuedeSubir() {
  const valor = estado.config.permitirSubida;
  if (typeof valor === "boolean") return valor;
  return (
    location.protocol === "file:" ||
    ["localhost", "127.0.0.1", "[::1]", ""].includes(location.hostname)
  );
}

/** Hay un intento en curso con respuestas ya enviadas. */
const intentoVivo = () =>
  Boolean(estado.quiz && estado.quiz.historial.length && !estado.quiz.terminado);

/* == barra superior ======================================================== */

function pintarBarra() {
  const u = estado.usuario;
  let derecha = "";

  if (u?.estado === "dentro") {
    derecha = `
      <span class="usuario" title="${esc(u.nombre)}">
        <span class="avatar" aria-hidden="true">${esc(u.iniciales)}</span>
        <span class="usuario-nombre">${esc(u.nombre)}</span>
      </span>
      <a class="btn fantasma pequeno" href="${URL_LOGOUT()}">Salir</a>`;
  } else if (u?.estado === "fuera") {
    derecha = `<a class="btn pequeno" href="${URL_LOGIN()}">Iniciar sesión con Microsoft</a>`;
  } else {
    derecha = `<span class="usuario"><span class="avatar" aria-hidden="true">··</span>
      <span class="usuario-nombre">Modo local</span></span>`;
  }

  barra.innerHTML = `
    <div class="barra-int">
      <button class="marca" type="button" data-ir="inicio">
        <span class="icono" aria-hidden="true">📖</span>${esc(estado.config.marca || "Ruta de estudio")}
      </button>
      <div class="barra-fin">${derecha}</div>
    </div>`;
}

/* == vista: catalogo de modulos ============================================ */

function vistaInicio() {
  estado.quiz = null;
  const progreso = leerProgreso();
  const total = estado.modulos.reduce((n, m) => n + m.preguntas.length, 0);

  const tarjetas = estado.modulos
    .map((m, i) => {
      const nota = progreso[m.id];
      const etiqueta = m.etiqueta || `Módulo ${m.orden ?? i + 1}`;
      const insignias = [
        nota ? `<span class="marca-nota ${nota.mejor >= m.notaMinima ? "aprobado" : ""}">Mejor: ${Number(nota.mejor) || 0}%</span>` : "",
        m.origen === "local" ? `<span class="marca-nota local">Solo en este navegador</span>` : "",
      ].join("");

      return `
        <button class="tarjeta" type="button" data-modulo="${esc(m.id)}">
          <span class="tarjeta-cab">
            <span class="etiqueta">${esc(etiqueta)}</span>
            <span class="flecha" aria-hidden="true">→</span>
          </span>
          <h2>${esc(m.titulo)}</h2>
          <p>${esc(m.descripcion)}</p>
          <span class="tarjeta-pie">
            <span>${plural(m.preguntas.length, "pregunta", "preguntas")}</span>
            ${insignias}
          </span>
        </button>`;
    })
    .join("");

  const avisos = estado.errores.length
    ? `<div class="error-carga">
         <h2>Algún módulo no se pudo cargar</h2>
         ${estado.errores.map((e) => `<p>${esc(e)}</p>`).join("")}
       </div>`
    : "";

  pintar(`
    <h1>${esc(estado.config.titulo)}</h1>
    <p class="subtitulo">${esc(estado.config.descripcion)}</p>
    <span class="pastilla">${plural(estado.modulos.length, "módulo", "módulos")} · ${plural(total, "pregunta", "preguntas")}</span>

    <div class="rejilla">
      ${tarjetas}
      ${
        sePuedeSubir()
          ? `<button class="tarjeta fantasma" type="button" data-ir="subir">
               <span class="tarjeta-cab">
                 <span class="etiqueta">Nuevo</span>
                 <span class="flecha" aria-hidden="true">+</span>
               </span>
               <h2>Añadir un módulo</h2>
               <p>Sube un archivo JSON con tus preguntas o copia la plantilla.</p>
             </button>`
          : ""
      }
    </div>
    ${avisos}`);

  app.querySelectorAll("[data-modulo]").forEach((btn) => {
    btn.addEventListener("click", () => empezarModulo(btn.dataset.modulo));
  });
}

/* == cuestionario ========================================================== */

function empezarModulo(id) {
  const modulo = estado.modulos.find((m) => m.id === id);
  if (!modulo) return vistaInicio();

  let preguntas = modulo.barajarPreguntas ? barajar(modulo.preguntas) : [...modulo.preguntas];

  if (modulo.barajarOpciones) {
    preguntas = preguntas.map((p) => {
      const orden = barajar(p.opciones.map((_, i) => i));
      return {
        ...p,
        opciones: orden.map((i) => p.opciones[i]),
        correctas: p.correctas.map((c) => orden.indexOf(c)).sort((a, b) => a - b),
      };
    });
  }

  estado.quiz = {
    modulo,
    preguntas,
    indice: 0,
    seleccion: [],
    comprobada: false,
    historial: [], // { pregunta, elegidas, acierto }
  };

  history.pushState({ vista: "quiz" }, "");
  vistaQuiz();
}

function vistaQuiz() {
  const q = estado.quiz;
  if (!q) return vistaInicio();

  const pregunta = q.preguntas[q.indice];
  const numero = q.indice + 1;
  const totales = q.preguntas.length;
  const pct = Math.round(((numero - 1) / totales) * 100);

  const cuantas = pregunta.correctas.length;
  const tipo = pregunta.multiple
    ? `Selecciona las ${cuantas} correctas`
    : "Selecciona una opción";

  // El enunciado puede traer varios párrafos: los previos son el contexto y el
  // último es la pregunta en sí.
  const parrafos = pregunta.enunciado.split(/\n{2,}/).filter((t) => t.trim());
  const enunciado = parrafos.pop() || pregunta.enunciado;
  const contexto = parrafos.map((t) => `<p class="contexto">${esc(t)}</p>`).join("");

  const opciones = pregunta.opciones
    .map((texto, i) => `
      <label class="opcion" data-indice="${i}">
        <input type="${pregunta.multiple ? "checkbox" : "radio"}" name="opcion" value="${i}" />
        <span class="letra" aria-hidden="true">${letra(i)}</span>
        <span class="texto">${esc(texto)}</span>
      </label>`)
    .join("");

  pintar(`
    <button class="volver" type="button" data-salir>← Salir del módulo</button>

    <div class="quiz-cab">
      <h2>${esc(q.modulo.titulo)}</h2>
      <span class="quiz-meta">Pregunta ${numero} de ${totales}</span>
    </div>
    <div class="progreso"><i id="barra-progreso"></i></div>

    <section class="panel">
      <span class="tipo-nota">${tipo}</span>
      ${contexto}
      <p class="enunciado">${esc(enunciado)}</p>

      <fieldset class="opciones" id="opciones">
        <legend class="solo-lector">${esc(enunciado)}</legend>
        ${opciones}
      </fieldset>

      <div id="zona-feedback" aria-live="polite"></div>

      <div class="acciones">
        <button class="btn" type="button" id="comprobar" disabled>Comprobar respuesta</button>
        <span class="aviso" id="aviso">${
          pregunta.multiple
            ? `Marcadas 0 de ${cuantas}. Hay que acertar todas.`
            : "No podrás volver a esta pregunta."
        }</span>
      </div>
    </section>`);

  app.querySelector("#barra-progreso").style.width = `${pct}%`;

  const contenedor = app.querySelector("#opciones");
  const botonComprobar = app.querySelector("#comprobar");

  const aviso = app.querySelector("#aviso");

  contenedor.addEventListener("change", () => {
    if (q.comprobada) return;
    const marcadas = [...contenedor.querySelectorAll("input:checked")].map((el) => Number(el.value));
    q.seleccion = marcadas;
    contenedor.querySelectorAll(".opcion").forEach((el) => {
      el.classList.toggle("marcada", marcadas.includes(Number(el.dataset.indice)));
    });

    if (pregunta.multiple) {
      // Se responde con el conjunto completo: no hay aciertos parciales.
      botonComprobar.disabled = marcadas.length !== cuantas;
      aviso.textContent = `Marcadas ${marcadas.length} de ${cuantas}. Hay que acertar todas.`;
    } else {
      botonComprobar.disabled = marcadas.length === 0;
    }
  });

  botonComprobar.addEventListener("click", comprobar);
  app.querySelector("[data-salir]").addEventListener("click", salirDelModulo);
}

function comprobar() {
  const q = estado.quiz;
  const pregunta = q.preguntas[q.indice];
  const elegidas = [...q.seleccion].sort((a, b) => a - b);
  const acierto = mismoConjunto(elegidas, pregunta.correctas);

  q.comprobada = true;
  q.historial.push({ pregunta, elegidas, acierto });

  const contenedor = app.querySelector("#opciones");
  contenedor.classList.add("resuelto");
  contenedor.querySelectorAll("input").forEach((el) => (el.disabled = true));

  contenedor.querySelectorAll(".opcion").forEach((el) => {
    const i = Number(el.dataset.indice);
    const esCorrecta = pregunta.correctas.includes(i);
    const elegida = elegidas.includes(i);
    if (esCorrecta) {
      el.classList.add("correcta");
      el.insertAdjacentHTML("beforeend", `<span class="pista">Correcta</span>`);
    } else if (elegida) {
      el.classList.add("fallada");
      el.insertAdjacentHTML("beforeend", `<span class="pista">Tu respuesta</span>`);
    }
  });

  const solucion = pregunta.correctas.map((i) => letra(i)).join(", ");
  const explicacion = pregunta.explicacion
    ? `<p class="porque"><b>Por qué:</b> ${esc(pregunta.explicacion)}</p>`
    : "";

  app.querySelector("#zona-feedback").innerHTML = `
    <div class="feedback ${acierto ? "bien" : "mal"}">
      <strong>${acierto ? "¡Correcto!" : "Incorrecto"}</strong>
      <p>Respuesta correcta: <b>${solucion}</b> — ${esc(
        pregunta.correctas.map((i) => pregunta.opciones[i]).join(" · ")
      )}</p>
      ${explicacion}
    </div>`;

  const ultima = q.indice === q.preguntas.length - 1;
  const acciones = app.querySelector(".acciones");
  acciones.innerHTML = `
    <button class="btn" type="button" id="siguiente">${ultima ? "Ver resultados" : "Siguiente pregunta →"}</button>`;

  const siguiente = acciones.querySelector("#siguiente");
  siguiente.addEventListener("click", () => {
    if (ultima) return vistaResultados();
    q.indice += 1;
    q.seleccion = [];
    q.comprobada = false;
    vistaQuiz();
  });
  siguiente.focus();
}

function salirDelModulo() {
  const q = estado.quiz;
  if (intentoVivo() && !confirm("Si sales ahora perderás las respuestas de este intento. ¿Salir?")) return;
  estado.quiz = null;
  vistaInicio();
}

/* == vista: resultados ===================================================== */

function vistaResultados() {
  const q = estado.quiz;
  if (!q) return vistaInicio();

  const total = q.historial.length;
  const aciertos = q.historial.filter((h) => h.acierto).length;
  const porcentaje = total ? Math.round((aciertos / total) * 100) : 0;
  const aprobado = porcentaje >= q.modulo.notaMinima;
  q.terminado = true;

  guardarProgreso(q.modulo.id, { aciertos, total, porcentaje });

  const repaso = q.historial
    .map((h, i) => {
      const tuya = h.elegidas.length
        ? h.elegidas.map((x) => `${letra(x)}. ${esc(h.pregunta.opciones[x])}`).join("<br>")
        : "Sin responder";
      const buena = h.pregunta.correctas
        .map((x) => `${letra(x)}. ${esc(h.pregunta.opciones[x])}`)
        .join("<br>");
      const porque = h.pregunta.explicacion
        ? `<dt>Por qué</dt><dd>${esc(h.pregunta.explicacion)}</dd>`
        : "";

      return `
        <article class="repaso-item ${h.acierto ? "bien" : "mal"}">
          <h3>${i + 1}. ${esc(soloPregunta(h.pregunta.enunciado))}</h3>
          <dl>
            <dt>Tu respuesta</dt>
            <dd class="${h.acierto ? "ok" : "no"}">${tuya}</dd>
            ${h.acierto ? "" : `<dt>Respuesta correcta</dt><dd class="ok">${buena}</dd>`}
            ${porque}
          </dl>
        </article>`;
    })
    .join("");

  pintar(`
    <section class="panel">
      <div class="marcador">
        <div class="nota" id="nota"><span>${porcentaje}%</span></div>
        <div class="marcador-txt">
          <h2>${aprobado ? "¡Módulo superado!" : "Sigue repasando"}</h2>
          <p>Has acertado <b>${aciertos}</b> de <b>${total}</b> preguntas de
             <b>${esc(q.modulo.titulo)}</b>. Mínimo para superarlo: ${q.modulo.notaMinima}%.</p>
        </div>
      </div>
      <div class="acciones">
        <button class="btn" type="button" id="repetir">Repetir módulo</button>
        <button class="btn fantasma" type="button" data-ir="inicio">Volver a los módulos</button>
      </div>
    </section>

    <h2 class="titulo-seccion">Repaso de las respuestas</h2>
    <div class="repaso">${repaso}</div>`);

  app.querySelector("#nota").style.setProperty("--pct", porcentaje);
  app.querySelector("#repetir").addEventListener("click", () => empezarModulo(q.modulo.id));
}

/* == vista: subir modulos ================================================== */

  estado.quiz = null;

  pintar(`
    <button class="volver" type="button" data-ir="inicio">← Volver a los módulos</button>
    <h1 class="titulo-menor">Añadir un módulo</h1>
    <p class="subtitulo">

      <code>modules/index.json</code>.
    </p>

    <div class="suelta" id="suelta">
      <p>Arrastra aquí un archivo <b>.json</b> o selecciónalo</p>
      <input type="file" id="archivo" accept=".json,application/json" class="solo-lector" />
      <button class="btn" type="button" id="elegir">Elegir archivo</button>
      <button class="btn fantasma" type="button" id="plantilla">Descargar plantilla</button>
    </div>

    <label for="json" class="ayuda"><b>Contenido del módulo</b></label>
    <textarea class="json" id="json" spellcheck="false"
      placeholder="Pega aquí el JSON del módulo...">${esc(JSON.stringify(PLANTILLA, null, 2))}</textarea>

    <div id="resultado-validacion"></div>

    <div class="acciones separado">
      <button class="btn fantasma" type="button" id="validar">Validar</button>
      <button class="btn" type="button" id="anadir">Añadir a este navegador</button>
    </div>

    <h2 class="titulo-seccion pequeno">Formato</h2>
    <p class="ayuda">
      Campos obligatorios: <code>titulo</code>, <code>preguntas</code>, y en cada pregunta
      <code>pregunta</code>, <code>opciones</code> y <code>correcta</code>.
      <code>explicacion</code> es opcional. Para varias respuestas correctas usa una lista:
      <code>"correcta": ["A", "C"]</code>. También valen el texto exacto de la opción y los
      sinónimos en inglés (<code>question</code>, <code>options</code>, <code>answer</code>,
      <code>explanation</code>).
    </p>

    <div id="lista-locales"></div>`);

  const caja = app.querySelector("#json");
  const zona = app.querySelector("#suelta");
  const archivo = app.querySelector("#archivo");

  const validar = () => {
    const salida = app.querySelector("#resultado-validacion");
    let bruto;
    try {
      bruto = JSON.parse(caja.value);
    } catch (e) {
      salida.innerHTML = `<ul class="lista-errores"><li>JSON mal formado: ${esc(e.message)}</li></ul>`;
      return null;
    }
    const { ok, modulo, errores } = normalizarModulo(bruto);
    if (!ok) {
      salida.innerHTML = `<ul class="lista-errores">${errores.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>`;
      return null;
    }
    const conExplicacion = modulo.preguntas.filter((p) => p.explicacion).length;
    salida.innerHTML = `<div class="exito">
      <b>Todo correcto.</b> ${esc(modulo.titulo)} · ${plural(modulo.preguntas.length, "pregunta", "preguntas")}
      (${conExplicacion} con explicación).</div>`;
    return { bruto, modulo };
  };

  const cargarArchivo = (file) => {
    if (!file) return;
    const lector = new FileReader();
    lector.onload = () => {
      caja.value = String(lector.result);
      validar();
    };
    lector.readAsText(file);
  };

  app.querySelector("#elegir").addEventListener("click", () => archivo.click());
  archivo.addEventListener("change", () => cargarArchivo(archivo.files[0]));

  ["dragenter", "dragover"].forEach((ev) =>
    zona.addEventListener(ev, (e) => {
      e.preventDefault();
      zona.classList.add("encima");
    })
  );
  ["dragleave", "drop"].forEach((ev) =>
    zona.addEventListener(ev, (e) => {
      e.preventDefault();
      zona.classList.remove("encima");
    })
  );
  zona.addEventListener("drop", (e) => cargarArchivo(e.dataTransfer?.files?.[0]));

  app.querySelector("#plantilla").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(PLANTILLA, null, 2)], { type: "application/json" });
    const enlace = Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(blob),
      download: "modulo-plantilla.json",
    });
    enlace.click();
    URL.revokeObjectURL(enlace.href);
  });

  app.querySelector("#validar").addEventListener("click", validar);

  app.querySelector("#anadir").addEventListener("click", async () => {
    const valido = validar();
    if (!valido) return;
    guardarLocal(valido.bruto, valido.modulo.id);
    await recargarCatalogo();
    vistaSubir();
    app.querySelector("#resultado-validacion").innerHTML =
      `<div class="exito"><b>Módulo añadido.</b> Ya aparece en la lista de módulos de este navegador.</div>`;
  });

  pintarLocales();
}

function pintarLocales() {
  const zona = app.querySelector("#lista-locales");
  if (!zona) return;
  const locales = leerLocales();
  if (!locales.length) {
    zona.innerHTML = "";
    return;
  }
  zona.innerHTML = `
    <h2 class="titulo-seccion pequeno">Módulos de este navegador</h2>
    <div class="tabla-locales">
      ${locales
        .map(
          (m) => `<div class="fila-local">
            <span class="nombre"><b>${esc(m.titulo)}</b> · ${plural(m.preguntas.length, "pregunta", "preguntas")}</span>
            <button class="btn fantasma pequeno" type="button" data-borrar="${esc(m.id)}">Quitar</button>
          </div>`
        )
        .join("")}
    </div>`;

  zona.querySelectorAll("[data-borrar]").forEach((btn) =>
    btn.addEventListener("click", async () => {
      borrarLocal(btn.dataset.borrar);
      await recargarCatalogo();
      vistaSubir();
    })
  );
}

/* == arranque ============================================================== */

async function recargarCatalogo() {
  const { config, modulos, errores } = await cargarCatalogo();
  estado.config = config;
  estado.modulos = modulos;
  estado.errores = errores;
  document.title = config.marca || "Ruta de estudio";
}

// Navegacion global (marca, "volver", "añadir modulo")
document.addEventListener("click", (e) => {
  const destino = e.target.closest("[data-ir]")?.dataset.ir;
  if (!destino) return;
  if (intentoVivo()) {
    if (!confirm("Si sales ahora perderás las respuestas de este intento. ¿Salir?")) return;
    estado.quiz = null;
  }
  if (destino === "inicio") vistaInicio();
  if (destino === "subir") vistaSubir();
});

// El boton "atras" del navegador no debe devolver a una pregunta ya contestada.
window.addEventListener("popstate", () => {
  if (intentoVivo()) {
    if (!confirm("Si sales ahora perderás las respuestas de este intento. ¿Salir?")) {
      history.pushState({ vista: "quiz" }, "");
      return;
    }
  }
  estado.quiz = null;
  vistaInicio();
});

(async function iniciar() {
  estado.usuario = await sesion();
  await recargarCatalogo();
  pintarBarra();
  vistaInicio();
})();

  </script>
